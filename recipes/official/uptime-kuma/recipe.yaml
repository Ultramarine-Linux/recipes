# yaml-language-server: $schema=../../../schema/recipe.schema.json
recipe_id: uptime-kuma
name: Uptime Kuma
description: Monitor websites and services and get notified when they go down.
category: monitoring
icon: uptimekuma
version: 0.1.0
requires:
  - podman
  - quadlets
parameters:
  - key: app_id
    label: App ID
    type: string
    required: true
    default: uptime-kuma
  - key: host_port
    label: Host port
    type: integer
    required: true
    default: 3001
    min: 1024
    max: 65535
resources:
  - type: volume
    filename: "{{ app_id }}-data.volume"
    template: volumes/named.volume.tera
  - type: container
    filename: "{{ app_id }}.container"
    template: containers/uptime-kuma.container.tera
