# yaml-language-server: $schema=../../../schema/recipe.schema.json
recipe_id: actual
name: Actual Budget
description: Local-first personal budgeting with sync across your devices. Needs HTTPS.
category: productivity
icon: actualbudget
version: 0.1.1
requires:
  - podman
  - quadlets
parameters:
  - key: app_id
    label: App ID
    type: string
    required: true
    default: actual
  - key: host_port
    label: Host port
    type: integer
    required: true
    default: 5006
    min: 1024
    max: 65535
resources:
  - type: volume
    filename: "{{ app_id }}-data.volume"
    template: shared/named.volume.tera
  - type: container
    filename: "{{ app_id }}.container"
    template: actual.container.tera