name: Recipes

# Checks and builds the recipe catalog itself. Rust formatting, lints, and
# tests run in rust.yml.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recipes-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Recipes whose bundle changed since this catalog was published must bump
  # their version.
  PUBLISHED_INDEX: https://recipes.fyralabs.com/v1/index.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: recipes check
        run: |
          previous=()
          if curl -fsSL --max-time 30 "$PUBLISHED_INDEX" -o "$RUNNER_TEMP/published.json"; then
            previous=(--previous "$RUNNER_TEMP/published.json")
          else
            echo "::warning::couldn't fetch $PUBLISHED_INDEX; skipping the version bump check"
          fi
          cargo run --locked -p recipes -- check "${previous[@]}"
      - run: cargo run --locked -p recipes -- build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
